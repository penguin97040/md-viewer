name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read only by default; the release job gets what it needs. Actions are
# pinned to commits, so a moved tag can't change what runs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  dependencies:
    uses: ./.github/workflows/dependencies.yml

  build:
    needs: dependencies
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-14
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bash scripts/check-version.sh "$GITHUB_REF_NAME"
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # rust-toolchain.toml pins the compiler; rustup (already on the runners) installs it.
      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show active-toolchain
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake pkg-config \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-xkb-dev \
            libx11-xcb-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev

      # Compiled-in panic messages hold source paths; replace the build machine's (docs/BUILDING.md).
      - name: Set path remapping
        run: |
          if [ "$RUNNER_OS" = Windows ]; then home=$USERPROFILE; else home=$HOME; fi
          echo "RUSTFLAGS=--remap-path-prefix=$home/.cargo=/cargo --remap-path-prefix=$home/.rustup=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/src" >> "$GITHUB_ENV"

      - name: Build (Windows)
        if: matrix.name == 'windows'
        env:
          # Fails the build if the shaders would be compiled when the app starts.
          MDV_REQUIRE_PRECOMPILED_SHADERS: "1"
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc -p md-viewer --features precompiled-shaders
          bash scripts/check-release-binary.sh windows target/x86_64-pc-windows-msvc/release/md-viewer.exe

      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p md-viewer
          bash scripts/check-release-binary.sh other target/x86_64-unknown-linux-gnu/release/md-viewer

      - name: Build (macOS)
        if: matrix.name == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t" -p md-viewer
            bash scripts/check-release-binary.sh other "target/$t/release/md-viewer"
          done

      - name: Package
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          v=$VERSION
          mkdir -p dist
          case "$NAME" in
            windows) cp target/x86_64-pc-windows-msvc/release/md-viewer.exe "dist/md-viewer-$v-windows-amd64.exe" ;;
            linux)   tar -C target/x86_64-unknown-linux-gnu/release -czf "dist/md-viewer-$v-linux-amd64.tar.gz" md-viewer ;;
            macos)
              bash scripts/package-macos.sh "$v" "dist/md-viewer-$v-macos-universal.zip" \
                target/aarch64-apple-darwin/release/md-viewer target/x86_64-apple-darwin/release/md-viewer ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # publish the release
      id-token: write     # sign the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          test "$(ls | wc -l)" -eq 3   # Windows, Linux and macOS, nothing else
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Lets anyone check a download was built here from this repository:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/md-viewer-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "MD Viewer $GITHUB_REF_NAME" --generate-notes
          fi
