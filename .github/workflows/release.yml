name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read only by default; the release job gets what it needs. Actions are
# pinned to commits, so a moved tag can't change what runs.
permissions:
  contents: read

env:
  WAILS_VERSION: v2.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: ubuntu-24.04
            platform: windows/amd64
          - name: linux
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
          - name: macos
            os: macos-14
            platform: darwin/universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"

      - name: Test
        if: matrix.name == 'linux'
        run: go test ./internal/...

      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          jq --arg v "$v" '.info.productVersion = ($v | split("-")[0])' wails.json > wails.tmp && mv wails.tmp wails.json

      - name: Build
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TAGS: ${{ matrix.tags }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          wails build -platform "$PLATFORM" -trimpath ${TAGS:+-tags "$TAGS"} \
            -ldflags "-s -w -X main.version=$VERSION"

      - name: Package
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          v=$VERSION
          mkdir -p dist
          case "$NAME" in
            windows) cp build/bin/md-viewer.exe "dist/md-viewer-$v-windows-amd64.exe" ;;
            linux)   tar -C build/bin -czf "dist/md-viewer-$v-linux-amd64.tar.gz" md-viewer ;;
            macos)
              app=$(cd build/bin && ls -d *.app | head -n1)
              (cd build/bin && ditto -c -k --keepParent "$app" "../../dist/md-viewer-$v-macos-universal.zip") ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # publish the release
      id-token: write     # sign the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Lets anyone check a download was built here from this repository:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/md-viewer-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "MD Viewer $GITHUB_REF_NAME" --generate-notes
          fi
