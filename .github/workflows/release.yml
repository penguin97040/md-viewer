name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: ubuntu-24.04
            platform: windows/amd64
          - name: linux
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
          - name: macos
            os: macos-14
            platform: darwin/universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Test
        if: matrix.name == 'linux'
        run: go test ./internal/...

      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          jq --arg v "$v" '.info.productVersion = ($v | split("-")[0])' wails.json > wails.tmp && mv wails.tmp wails.json

      - name: Build
        shell: bash
        run: |
          wails build -platform ${{ matrix.platform }} -trimpath \
            ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }} \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}"

      - name: Package
        shell: bash
        run: |
          v=${{ steps.ver.outputs.version }}
          mkdir -p dist
          case "${{ matrix.name }}" in
            windows) cp build/bin/md-viewer.exe "dist/md-viewer-$v-windows-amd64.exe" ;;
            linux)   tar -C build/bin -czf "dist/md-viewer-$v-linux-amd64.tar.gz" md-viewer ;;
            macos)
              app=$(cd build/bin && ls -d *.app | head -n1)
              (cd build/bin && ditto -c -k --keepParent "$app" "../../dist/md-viewer-$v-macos-universal.zip") ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "MD Viewer $GITHUB_REF_NAME" --generate-notes
          fi
