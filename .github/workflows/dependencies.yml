name: Dependency checks

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 1"   # advisories appear without any change here

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show active-toolchain
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake pkg-config \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-xkb-dev \
            libx11-xcb-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev
      - name: Test
        run: cargo test --workspace --locked
      - name: Generated files are current
        if: runner.os == 'Linux'
        run: |
          python3 scripts/generate-theme.py
          git diff --exit-code -- crates/theme
          python3 scripts/generate-licences.py --check

  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tools
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-audit-${{ env.CARGO_AUDIT_VERSION }}-deny-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-audit and cargo-deny
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --root ~/.cargo-tools --version "$CARGO_AUDIT_VERSION" cargo-audit
          cargo install --locked --root ~/.cargo-tools --version "$CARGO_DENY_VERSION" cargo-deny
      - name: cargo audit
        run: ~/.cargo-tools/bin/cargo-audit audit --deny warnings
      - name: cargo deny
        run: ~/.cargo-tools/bin/cargo-deny --locked check
