[workspace]
resolver = "2"
members = ["crates/theme", "crates/app", "crates/reader", "crates/content", "crates/platform", "crates/print", "crates/webimage"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
anyhow = "=1.0.104"
dunce = "=1.0.5"
embed-resource = "=3.0.12"
pulldown-cmark = { version = "=0.13.6", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
rayon = "=1.12.0"
memchr = "=2.8.3"
regex = "=1.13.1"
unicode-linebreak = "=0.1.5"
unicode-properties = "=0.1.5"
unicode-segmentation = "=1.13.3"
unicode-normalization = "=0.1.25"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
mdv-theme = { path = "crates/theme" }
mdv-reader = { path = "crates/reader" }
mdv-content = { path = "crates/content" }
mdv-platform = { path = "crates/platform" }
mdv-print = { path = "crates/print" }
raw-window-handle = "=0.6.2"
async-channel = "=2.5.0"
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
libc = "=0.2.191"
x11rb = { version = "=0.13.2", default-features = false, features = ["randr"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
ratex-types = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
merman = { version = "=0.10.0-alpha.1", default-features = false, features = ["svg", "all-diagrams", "layout-cytoscape", "native-fonts"] }
merman-export = { version = "=0.10.0-alpha.1", default-features = false, features = ["native-fonts"] }
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
usvg = { version = "=0.47.0", default-features = false, features = ["text"] }
fontdb = { version = "=0.23.0", default-features = false, features = ["fs", "memmap", "fontconfig"] }
roxmltree = "=0.21.2"
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
krilla-svg = "=0.8.1"
rustybuzz = "=0.20.1"
png = "=0.17.16"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
url = "=2.5.8"
mdv-webimage = { path = "crates/webimage" }
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }

# Measured on the spike: Windows 102 MB by default, 72 MB stripped, 40 MB with fat LTO, 30 MB with
# opt-level "s", 26 MB with this profile, 25 MB with "z" everywhere (which nearly doubles find time).
# Keep panic = "unwind": diagram, maths, PDF and layout panics are contained with catch_unwind.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true

# The largest code by far and none of it on the scrolling path, so it gets "z".
[profile.release.package.merman]
opt-level = "z"
[profile.release.package.merman-core]
opt-level = "z"
[profile.release.package.merman-render]
opt-level = "z"
[profile.release.package.merman-model]
opt-level = "z"
[profile.release.package.merman-markup]
opt-level = "z"
[profile.release.package.merman-export]
opt-level = "z"
[profile.release.package.dugong]
opt-level = "z"
[profile.release.package.manatee]
opt-level = "z"
[profile.release.package.html5ever]
opt-level = "z"
[profile.release.package.krilla]
opt-level = "z"
[profile.release.package.krilla-svg]
opt-level = "z"
[profile.release.package.write-fonts]
opt-level = "z"
