[package]
name = "md-viewer"
version = "1.0.0"
edition.workspace = true
publish.workspace = true

build = "build.rs"

[dependencies]
serde_json = "=1.0.154"
gpui.workspace = true
anyhow.workspace = true
dunce.workspace = true
gpui_platform.workspace = true
mdv-theme.workspace = true
mdv-reader.workspace = true
mdv-content.workspace = true
mdv-platform.workspace = true
mdv-print.workspace = true
raw-window-handle.workspace = true
async-channel.workspace = true
notify.workspace = true

[target.'cfg(windows)'.dependencies]
gpui-pre-windows = { version = "=0.3.11", default-features = false }

[features]
# Windows releases: build the shaders with fxc.exe on a Windows host, so the exe never compiles
# them at start-up. Without it the exe compiles with d3dcompiler_47.dll (the Linux cross-build).
precompiled-shaders = ["gpui-pre-windows/precompiled-shaders"]

[build-dependencies]
embed-resource.workspace = true
